<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de administración</title>
<style>
:root{--fondo:#faf6f4;--tarjeta:#fff;--tinta:#2b2326;--suave:#7a6d70;--rosa:#a8456b;--rosa-f:#8c3558;--borde:#eadfe0;--ok:#2f7d57;--mal:#b3392f;--aviso:#b9770e}
*{box-sizing:border-box}
body{margin:0;font:17px/1.5 Georgia,'Times New Roman',serif;background:var(--fondo);color:var(--tinta)}
button,input,select{font:inherit}
h1,h2{font-weight:normal;margin:0}
.centro{min-height:100vh;display:grid;place-items:center;padding:20px}
.caja{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:28px;width:100%;max-width:400px}
.caja h1{font-size:28px;margin-bottom:6px}
label{display:block;margin:14px 0 4px;color:var(--suave);font-size:15px}
input,select{width:100%;padding:12px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid #e7b3c8;outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--rosa);color:#fff;cursor:pointer;font-size:16px}
.btn:hover{background:var(--rosa-f)}
.btn.sec{background:#f3e8ea;color:var(--tinta)}.btn.sec:hover{background:#ead9dd}
.btn.ok{background:var(--ok)}.btn.mal{background:var(--mal)}
.btn.peq{padding:8px 13px;font-size:15px}
.ancho{width:100%;margin-top:20px}
header{background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:22px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px 0;max-width:980px;margin:auto}
nav button{border:1px solid var(--borde);background:var(--tarjeta);padding:11px 18px;border-radius:999px;cursor:pointer;color:var(--suave)}
nav button.on{background:var(--rosa);border-color:var(--rosa);color:#fff}
main{max-width:980px;margin:auto;padding:18px 20px 60px}
.barra{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.barra input{max-width:260px;margin-left:auto}
.chip{border:1px solid var(--borde);background:var(--tarjeta);border-radius:999px;padding:8px 15px;cursor:pointer;font-size:15px}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.cita{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:110px 1fr;gap:16px}
.hora{font-size:26px;line-height:1.1}.hora small{display:block;font-size:14px;color:var(--suave);margin-top:4px;text-transform:capitalize}
.cita h2{font-size:19px}
.dato{color:var(--suave);font-size:15px}
.acciones{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.estado{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;margin-left:8px;border:1px solid currentColor;vertical-align:middle}
.pendiente{color:var(--aviso)}.confirmada{color:var(--ok)}.cancelada{color:var(--mal)}.completada{color:var(--suave)}
.fila{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;align-items:end}
.fila.inactivo{opacity:.6}
.fila label{margin:0 0 3px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--tinta)}.chk input{width:auto}
.dia{grid-template-columns:130px 130px 1fr 1fr}
.vacio{text-align:center;color:var(--suave);padding:40px 10px;background:var(--tarjeta);border:1px dashed var(--borde);border-radius:14px}
.aviso{background:#fff4dd;border:1px solid #ecd39b;padding:12px 16px;border-radius:12px;margin:14px 20px 0;max-width:940px}
@media(min-width:1000px){.aviso{margin:14px auto 0}}
table{width:100%;border-collapse:collapse;background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--borde);font-size:15px}
th{color:var(--suave);font-weight:normal;background:#fcf8f7}
.tabla{overflow-x:auto}
a{color:var(--rosa)}
dialog{border:0;border-radius:14px;padding:26px;max-width:420px;width:92%}
dialog::backdrop{background:rgba(43,35,38,.45)}
dialog h2{font-size:22px;margin-bottom:4px}
.par{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
#aviso-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:13px 22px;border-radius:12px;color:#fff;background:var(--ok);display:none;z-index:9;max-width:90%}
#aviso-toast.mal{background:var(--mal)}
.oculto{display:none!important}
@media(max-width:700px){.cita{grid-template-columns:1fr}.fila{grid-template-columns:1fr 1fr}.fila>:first-child{grid-column:1/-1}.dia{grid-template-columns:1fr 1fr}.barra input{max-width:none;margin:0;width:100%}}
</style>
</head>
<body>

<!-- Entrada -->
<section id="login" class="centro">
  <div class="caja">
    <h1>Panel de administración</h1>
    <div class="dato">Entra con tu correo y contraseña.</div>
    <label for="l-email">Correo</label><input id="l-email" type="email" autocomplete="username">
    <label for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password">
    <button class="btn ancho" id="l-btn">Entrar</button>
    <div id="l-err" class="dato" style="color:var(--mal);margin-top:12px"></div>
  </div>
</section>

<!-- Panel -->
<section id="panel" class="oculto">
  <header>
    <h1>Hola, <span id="nom"></span></h1>
    <div><button class="btn sec peq" onclick="abrirClave()">Cambiar contraseña</button> <button class="btn sec peq" onclick="salir()">Salir</button></div>
  </header>
  <div id="aviso-clave" class="aviso oculto">Todavía usas la contraseña de fábrica. Por seguridad, <a href="#" onclick="abrirClave();return false">cámbiala ahora</a>.</div>
  <nav>
    <button data-v="citas" class="on">Citas</button>
    <button data-v="servicios">Precios</button>
    <button data-v="horarios">Horarios</button>
    <button data-v="clientes">Clientes</button>
  </nav>
  <main>
    <div id="v-citas">
      <div class="barra">
        <button class="chip on" data-f="hoy">Hoy</button><button class="chip" data-f="prox">Próximas</button>
        <button class="chip" data-f="pend">Por confirmar</button><button class="chip" data-f="canc">Canceladas</button><button class="chip" data-f="todas">Todas</button>
        <input id="q-citas" placeholder="Buscar por nombre o servicio" aria-label="Buscar citas">
      </div>
      <div id="l-citas"></div>
    </div>
    <div id="v-servicios" class="oculto"><div id="l-servicios"></div></div>
    <div id="v-horarios" class="oculto"><div id="l-horarios"></div></div>
    <div id="v-clientes" class="oculto">
      <div class="barra"><input id="q-cli" placeholder="Buscar cliente" aria-label="Buscar cliente" style="margin-left:0"></div>
      <div id="l-clientes" class="tabla"></div>
    </div>
  </main>
</section>

<dialog id="m"></dialog>
<div id="aviso-toast" role="status"></div>

<script>
// Si esta página se aloja en Cloudflare Pages (y no en Railway), pon aquí la URL de Railway, ej: 'https://tuapp.up.railway.app'
const API = '';
let T = localStorage.getItem('adm_token'), CITAS = [], CLIENTES = [], filtro = 'hoy';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => '$' + Number(n).toLocaleString('es-CO');
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fecha = f => { const [y,m,d] = f.substr(0,10).split('-'); return new Date(y, m-1, d).toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'}); };
const hora = f => { let [h,m] = f.substr(11,5).split(':'); h = +h; return (h%12||12) + ':' + m + (h<12 ? ' am' : ' pm'); };
const wa = t => { const n = String(t||'').replace(/\D/g,''); return n ? 'https://wa.me/' + (n.length === 10 ? '57' : '') + n : ''; };

function aviso(msg, mal) { const t = $('#aviso-toast'); t.textContent = msg; t.className = mal ? 'mal' : ''; t.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(() => t.style.display = 'none', 3500); }

async function api(ruta, metodo = 'GET', cuerpo) {
  const r = await fetch(API + '/api/admin' + ruta, { method: metodo, headers: { 'Content-Type': 'application/json', ...(T ? { Authorization: 'Bearer ' + T } : {}) }, body: cuerpo ? JSON.stringify(cuerpo) : undefined }).catch(() => { throw new Error('No se pudo conectar con el servidor. Revisa tu internet o la dirección de Railway.'); });
  const d = await r.json().catch(() => ({}));
  if ((r.status === 401 || r.status === 403) && ruta !== '/login') { salir(); throw new Error('Tu sesión terminó. Entra de nuevo.'); }
  if (!r.ok) throw new Error(d.error || 'Algo salió mal');
  return d;
}
async function intentar(fn) { try { await fn(); } catch (e) { aviso(e.message, true); } }

// ── Sesión ──
$('#l-btn').onclick = async () => {
  $('#l-err').textContent = '';
  try {
    const d = await api('/login', 'POST', { email: $('#l-email').value, password: $('#l-pass').value });
    T = d.token; localStorage.setItem('adm_token', T); localStorage.setItem('adm_nom', d.nombre);
    $('#aviso-clave').classList.toggle('oculto', !d.cambiar);
    entrar();
  } catch (e) { $('#l-err').textContent = e.message; }
};
$('#l-pass').onkeydown = e => { if (e.key === 'Enter') $('#l-btn').click(); };
function salir() { localStorage.removeItem('adm_token'); T = null; $('#panel').classList.add('oculto'); $('#login').classList.remove('oculto'); $('#l-pass').value = ''; }
function entrar() { $('#login').classList.add('oculto'); $('#panel').classList.remove('oculto'); $('#nom').textContent = localStorage.getItem('adm_nom') || ''; cargarCitas(); }

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['citas','servicios','horarios','clientes'].forEach(v => $('#v-' + v).classList.toggle('oculto', v !== b.dataset.v));
  ({ citas: cargarCitas, servicios: cargarServicios, horarios: cargarHorarios, clientes: cargarClientes })[b.dataset.v]();
});

// ── Citas ──
const cargarCitas = () => intentar(async () => { CITAS = await api('/citas'); pintarCitas(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { filtro = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); pintarCitas(); });
$('#q-citas').oninput = () => pintarCitas();

function pintarCitas() {
  const q = $('#q-citas').value.toLowerCase(), h = hoy();
  const L = CITAS.filter(c => {
    const d = c.fecha_cita.substr(0,10), viva = c.estado !== 'cancelada';
    const ok = { hoy: d === h && viva, prox: d >= h && viva, pend: c.estado === 'pendiente', canc: !viva, todas: true }[filtro];
    return ok && (c.nombre + ' ' + c.apellido + ' ' + c.servicio).toLowerCase().includes(q);
  });
  if (filtro === 'hoy' || filtro === 'prox') L.sort((a, b) => a.fecha_cita < b.fecha_cita ? -1 : 1);
  $('#l-citas').innerHTML = L.length ? L.map(c => `
    <article class="cita">
      <div class="hora">${hora(c.fecha_cita)}<small>${fecha(c.fecha_cita)}</small></div>
      <div>
        <h2>${esc(c.nombre)} ${esc(c.apellido)}<span class="estado ${c.estado}">${c.estado}</span></h2>
        <div>${esc(c.servicio)} · ${pesos(c.precio)} · ${c.duracion_minutos || 60} min</div>
        <div class="dato">${c.telefono ? `<a href="${wa(c.telefono)}" target="_blank" rel="noopener">${esc(c.telefono)} (WhatsApp)</a> · ` : ''}${esc(c.email)}</div>
        ${c.notas ? `<div class="dato">Nota del cliente: ${esc(c.notas)}</div>` : ''}
      </div>
      <div class="acciones">
        ${c.estado === 'pendiente' ? `<button class="btn ok peq" onclick="estadoCita(${c.id_cita},'confirmada')">Confirmar</button>` : ''}
        ${c.estado === 'confirmada' ? `<button class="btn sec peq" onclick="estadoCita(${c.id_cita},'completada')">Marcar como atendida</button>` : ''}
        ${c.estado !== 'cancelada' && c.estado !== 'completada' ? `<button class="btn sec peq" onclick="reagendar(${c.id_cita})">Cambiar fecha u hora</button><button class="btn mal peq" onclick="cancelarCita(${c.id_cita})">Cancelar cita</button>` : ''}
      </div>
    </article>`).join('') : '<div class="vacio">No hay citas en esta lista.</div>';
}
const estadoCita = (id, estado) => intentar(async () => { await api('/citas/' + id, 'PUT', { estado }); aviso('Cita actualizada'); cargarCitas(); });
function cancelarCita(id) {
  const c = CITAS.find(x => x.id_cita === id);
  if (confirm(`¿Cancelar la cita de ${c.nombre} ${c.apellido} (${fecha(c.fecha_cita)}, ${hora(c.fecha_cita)})?\nEl horario quedará libre.`)) estadoCita(id, 'cancelada');
}
function reagendar(id) {
  const c = CITAS.find(x => x.id_cita === id), m = $('#m');
  m.innerHTML = `<h2>Cambiar fecha u hora</h2><div class="dato">${esc(c.nombre)} ${esc(c.apellido)} · ${esc(c.servicio)}</div>
    <label for="nf">Nueva fecha y hora</label><input id="nf" type="datetime-local" step="900" value="${c.fecha_cita.substr(0,16)}">
    <div class="par"><button class="btn sec" onclick="m.close()">Volver</button><button class="btn" id="ok-r">Guardar cambio</button></div>`;
  m.showModal();
  $('#ok-r').onclick = () => intentar(async () => { await api('/citas/' + id, 'PUT', { fecha_cita: $('#nf').value }); m.close(); aviso('Cita reagendada'); cargarCitas(); });
}

// ── Precios ──
const cargarServicios = () => intentar(async () => {
  const S = await api('/servicios');
  $('#l-servicios').innerHTML = S.map(s => `
    <div class="fila ${s.activo ? '' : 'inactivo'}" data-id="${s.id_servicio}">
      <div><strong>${esc(s.nombre)}</strong><div class="dato">${esc(s.categoria)}</div></div>
      <div><label>Precio</label><input type="number" min="0" step="1000" class="p" value="${s.precio}"></div>
      <div><label>Precio hasta (opcional)</label><input type="number" min="0" step="1000" class="pm" value="${s.precio_max ?? ''}"></div>
      <div><label>Duración (min)</label><input type="number" min="5" step="5" class="d" value="${s.duracion_minutos || 60}"></div>
      <div><label class="chk"><input type="checkbox" class="a" ${s.activo ? 'checked' : ''}> Se ofrece</label><button class="btn peq" style="margin-top:6px" onclick="guardarServicio(this)">Guardar</button></div>
    </div>`).join('');
});
function guardarServicio(b) {
  const f = b.closest('.fila');
  intentar(async () => {
    await api('/servicios/' + f.dataset.id, 'PUT', { precio: f.querySelector('.p').value, precio_max: f.querySelector('.pm').value, duracion_minutos: f.querySelector('.d').value, activo: f.querySelector('.a').checked });
    f.classList.toggle('inactivo', !f.querySelector('.a').checked); aviso('Guardado');
  });
}

// ── Horarios ──
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const cargarHorarios = () => intentar(async () => {
  const H = await api('/horarios'), orden = [1,2,3,4,5,6,0];
  $('#l-horarios').innerHTML = orden.map(d => { const h = H.find(x => x.dia === d); return `
    <div class="fila dia" data-dia="${d}">
      <strong>${DIAS[d]}</strong>
      <label class="chk"><input type="checkbox" class="ab" ${h.abierto ? 'checked' : ''}> Abierto</label>
      <div><label>Abre</label><input type="time" class="ap" value="${h.apertura}"></div>
      <div><label>Cierra</label><input type="time" class="ci" value="${h.cierre}"></div>
    </div>`; }).join('') + '<button class="btn" onclick="guardarHorarios()">Guardar horarios</button>';
});
const guardarHorarios = () => intentar(async () => {
  const L = [...document.querySelectorAll('#l-horarios .dia')].map(f => ({ dia: +f.dataset.dia, abierto: f.querySelector('.ab').checked, apertura: f.querySelector('.ap').value, cierre: f.querySelector('.ci').value }));
  await api('/horarios', 'PUT', L); aviso('Horarios guardados');
});

// ── Clientes ──
const cargarClientes = () => intentar(async () => { CLIENTES = await api('/clientes'); pintarClientes(); });
$('#q-cli').oninput = () => pintarClientes();
function pintarClientes() {
  const q = $('#q-cli').value.toLowerCase();
  const L = CLIENTES.filter(c => (c.nombre + ' ' + c.apellido + ' ' + c.email + ' ' + (c.telefono || '')).toLowerCase().includes(q));
  $('#l-clientes').innerHTML = L.length ? `<table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Citas</th><th>Última cita</th></tr></thead><tbody>${L.map(c => `
    <tr><td>${esc(c.nombre)} ${esc(c.apellido)}</td><td>${c.telefono ? `<a href="${wa(c.telefono)}" target="_blank" rel="noopener">${esc(c.telefono)}</a>` : '—'}</td><td>${esc(c.email)}</td><td>${c.total_citas}</td><td>${c.ultima_cita ? fecha(c.ultima_cita) : '—'}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">No se encontraron clientes.</div>';
}

// ── Contraseña ──
function abrirClave() {
  const m = $('#m');
  m.innerHTML = `<h2>Cambiar contraseña</h2>
    <label for="c1">Contraseña actual</label><input id="c1" type="password" autocomplete="current-password">
    <label for="c2">Contraseña nueva (mínimo 8 caracteres)</label><input id="c2" type="password" autocomplete="new-password">
    <div class="par"><button class="btn sec" onclick="m.close()">Volver</button><button class="btn" id="ok-c">Guardar contraseña</button></div>`;
  m.showModal();
  $('#ok-c').onclick = () => intentar(async () => { await api('/password', 'PUT', { actual: $('#c1').value, nueva: $('#c2').value }); m.close(); $('#aviso-clave').classList.add('oculto'); aviso('Contraseña cambiada'); });
}

if (T) entrar();
</script>
</body>
</html>
